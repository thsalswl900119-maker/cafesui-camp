<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>강사 화면 · 컨셉북 워크북 ver.2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Do+Hyeon&display=swap"><style>
:root{--coral:#A9783F;--corald:#6F4E2A;--corall:#DCCBAE;--cream:#FBF7EF;--panel:#F3EBDC;--panel2:#FDFAF4;--ink:#4A3A2A;--grey:#948570;--line:#E6DAC4;--head:"BM HANNA 11yrs Old OTF","BMHANNA11yrsold","Do Hyeon",sans-serif;--body:"Nanum Gothic","Apple SD Gothic Neo",sans-serif}
html{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px}h1,h2,h3,h4{font-family:var(--head);font-weight:400;margin:0;color:var(--corald)}h1{font-size:26px}h2{font-size:19px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px;box-shadow:0 2px 6px rgba(223,205,184,.45)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--coral);color:#fff;font-family:var(--head);font-size:18px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--corald);border:1.5px solid var(--corall)}.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:14px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--corall);border-radius:10px;background:#fff;color:var(--ink);font-size:17px;margin-top:6px}
.msg{font-size:14px;color:var(--corald);margin-top:10px;min-height:20px}.ok{color:#4E6B2E;font-weight:700}.bad{color:#B04A3A;font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.row .info{flex:1}.row b{font-size:16px}.row small{display:block;font-size:13px;color:var(--grey)}
dl{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:8px 0;font-size:14.5px}dt{color:var(--grey);font-size:13px;padding-top:2px}dd{margin:0;white-space:pre-wrap}dd.e{color:#B9AC9F;font-style:italic}
h3.day{margin:18px 0 4px;font-size:18px;padding:8px 12px;background:var(--panel);border-left:4px solid var(--coral);border-radius:0 8px 8px 0}h4{margin:12px 0 2px;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}th{font-family:var(--head);font-weight:400;color:var(--corald);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}td{padding:4px 6px;border-bottom:1px solid var(--line)}
.sum{background:#fff;border:1.5px dashed var(--corall);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14.5px}
.line{font-family:var(--head);font-size:16px;background:var(--panel);border-radius:10px;padding:10px 12px;margin-top:6px}
.ok2{color:#4E6B2E}.warn{color:#B8860B}.bad2{color:#B04A3A}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
</style>

function fsEnc(v){if(v===null||v===undefined)return {nullValue:null};if(typeof v==='number')return (v%1===0)?{integerValue:String(v)}:{doubleValue:v};if(typeof v==='boolean')return {booleanValue:v};if(Array.isArray(v))return {arrayValue:{values:v.map(fsEnc)}};if(typeof v==='object'){var f={};Object.keys(v).forEach(function(k){f[k]=fsEnc(v[k]);});return {mapValue:{fields:f}};}return {stringValue:String(v)};}
function fsDec(v){if(!v)return null;if('stringValue' in v)return v.stringValue;if('integerValue' in v)return +v.integerValue;if('doubleValue' in v)return v.doubleValue;if('booleanValue' in v)return v.booleanValue;if('mapValue' in v){var o={},f=v.mapValue.fields||{};Object.keys(f).forEach(function(k){o[k]=fsDec(f[k]);});return o;}if('arrayValue' in v)return (v.arrayValue.values||[]).map(fsDec);return null;}
function fsFetch(url,opt){opt=opt||{};var c=window.AbortController?new AbortController():null,t=null;if(c){opt.signal=c.signal;t=setTimeout(function(){c.abort();},15000);}
  return fetch(url,opt).then(function(r){if(t)clearTimeout(t);return r.text().then(function(txt){var j={};try{j=txt?JSON.parse(txt):{};}catch(e){}if(!r.ok){var er=new Error((j.error&&j.error.message)||('http '+r.status));er.status=r.status;throw er;}return j;});},function(e){if(t)clearTimeout(t);throw e;});}
function fsGet(id){return fsFetch(FS_BASE+encodeURIComponent(id)+'?key='+FBC.apiKey).then(function(j){return j&&j.fields?fsDec({mapValue:{fields:j.fields}}):null;},function(e){if(e.status===404)return null;throw e;});}
function fsRoster(roster,id,now,remove){var q='?key='+FBC.apiKey+['name','code','day','updatedAt'].map(function(f){return '&updateMask.fieldPaths='+f;}).join('')+'&updateMask.fieldPaths='+encodeURIComponent('a.`'+id.replace(/[`\\]/g,'\\$&')+'`');
  var doc={name:'명단',code:roster,day:0,updatedAt:now,a:{}};if(!remove)doc.a[id]=now;
  return fsFetch(FS_BASE+encodeURIComponent('명단_'+roster)+q,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:fsEnc(doc).mapValue.fields})});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','"':'&quot;','>':'&gt;'}[c]});}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('b2o:'+s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});}
var $=function(s){return document.querySelector(s)},books=[];
function v(a,k){return String((a||{})[k]||'').trim();}
function n_(a,k){var x=parseFloat(v(a,k).replace(/[^\d.\-]/g,''));return isNaN(x)?null:x;}
function nz(a,k){var x=n_(a,k);return x==null?0:x;}
function won(x){return x==null||isNaN(x)?'—':Math.round(x).toLocaleString('ko-KR')+'원';}
function pct(x){return x==null||isNaN(x)||!isFinite(x)?'—':(Math.round(x*10)/10)+'%';}
function costOf(a,i){var m=n_(a,'m'+i+'_mat');if(m==null)return null;return (m+nz(a,'m'+i+'_pack'))*(1+nz(a,'m'+i+'_loss')/100);}
function rateOf(a,i){var c=costOf(a,i),p=n_(a,'m'+i+'_price');if(c==null||!p)return null;return c/p*100;}
function bep(a){var fx=['fx_rent','fx_labor','fx_util','fx_sub','fx_loan','fx_etc'].reduce(function(s,k){return s+nz(a,k)},0),vr=(nz(a,'v_fee')+nz(a,'v_mat'))/100,days=nz(a,'days_open')||26;var ap=0,n=0;for(var i=1;i<=4;i++){var p=n_(a,'m'+i+'_price');if(p){ap+=p;n++;}}ap=n?ap/n:null;if(!fx||vr>=1)return null;var month=fx/(1-vr);return {fx:fx,vr:vr,month:month,day:month/days,units:ap?month/days/ap:null};}
function conceptLine(a){return v(a,'book1_line')||v(a,'concept2')||v(a,'concept1')||'';}
function done(a){var n=0;[1,2,3].forEach(function(d){for(var p=1;p<=5;p++){if(FIELDS.some(function(f){return f.d===d&&f.p===p&&v(a,f.k)}))n++;}});return n;}
function tm(t){var d=new Date(t||0);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function roster(){return ROSTER;}
function load(){var r=roster();$('#rmsg').textContent='서버에서 불러오는 중…';
  fsGet('명단_'+r).then(function(rd){var ids=rd&&rd.a?Object.keys(rd.a):[];return Promise.all(ids.map(function(id){return fsGet(id).then(null,function(){return null;});}));}).then(function(docs){
    books=docs.filter(function(x){return x&&x.a&&typeof x.a==='object';}).sort(function(x,y){return (y.updatedAt||0)-(x.updatedAt||0);});
    var d=new Date();$('#rmsg').textContent='ver.'+VER+' 워크북 · 서버에서 '+books.length+'명 불러왔습니다 ('+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+').';draw();
  },function(e){$('#rmsg').innerHTML='<span class="bad">불러오지 못했습니다.</span> 인터넷을 확인하고 「새로 불러오기」를 누르세요. <small>'+esc(e&&e.message||'')+'</small>';});}
function draw(){var L=$('#list');L.innerHTML='';$('#cnt').textContent=books.length+'명';
  if(!books.length){L.innerHTML='<p style="color:var(--grey);font-size:14px">아직 받은 컨셉북이 없습니다. 학생이 워크북에서 「강사에게 보내기」를 누르면 여기에 뜹니다.</p>';return;}
  books.forEach(function(b){var r=document.createElement('div');r.className='row';var rt=[];for(var i=1;i<=4;i++){var x=rateOf(b.a,i);if(x!=null)rt.push(x);}var ar=rt.length?rt.reduce(function(s,x){return s+x},0)/rt.length:null;
    r.innerHTML='<div class="info"><b>'+esc(b.name)+' · '+esc(b.code)+'</b><small>'+esc(v(b.a,'name1')||'가게 이름 미정')+' · 작성 '+done(b.a)+'/15교시'+(ar!=null?' · 원가율 '+pct(ar):'')+' · '+tm(b.updatedAt)+' 보냄</small></div>';
    var o=document.createElement('button');o.className='btn sm';o.textContent='컨셉북';o.onclick=function(){show(b)};
    var x=document.createElement('button');x.className='btn ghost sm';x.textContent='빼기';x.onclick=function(){if(!x.dataset.a){x.dataset.a='1';x.textContent='정말?';setTimeout(function(){delete x.dataset.a;x.textContent='빼기'},3000);return;}fsRoster(roster(),sid(b.name,b.code),Date.now(),true).then(load,function(){alert('목록에서 빼지 못했습니다.')});};
    r.appendChild(o);r.appendChild(x);L.appendChild(r);});}
function show(b){var a=b.a;$('#dname').textContent=b.name+' · '+b.code+(v(a,'name1')?' · '+v(a,'name1'):'');
  var bp=bep(a);var h='<div class="sum"><div class="line">'+esc(conceptLine(a)||'컨셉 문장 아직 없음')+'</div>'+
    '<table><tr><th>메뉴</th><th>원가</th><th>판매가</th><th>원가율</th></tr>'+[1,2,3,4].map(function(i){var r=rateOf(a,i);var cl=r==null?'':(r<=33?'ok2':(r<=38?'warn':'bad2'));return '<tr><td>'+(i===1?'★ ':'')+esc(v(a,'menu'+i)||'—')+'</td><td>'+won(costOf(a,i))+'</td><td>'+won(n_(a,'m'+i+'_price'))+'</td><td class="'+cl+'">'+pct(r)+'</td></tr>'}).join('')+'</table>'+
    '<div style="margin-top:8px">'+(bp?'월 고정비 <b>'+won(bp.fx)+'</b> · 변동비율 '+pct(bp.vr*100)+' · 손익분기 월매출 <b>'+won(bp.month)+'</b> · 하루 <b>'+(bp.units?Math.ceil(bp.units)+'개':'—')+'</b>':'손익분기 아직 미계산')+(v(a,'daily_goal')?' · 하루 목표 <b>'+esc(v(a,'daily_goal'))+'개</b>':'')+'</div>'+
    '<div style="margin-top:6px">브랜드: <b>'+esc(v(a,'name1')||'—')+'</b> '+esc(v(a,'brand_line')||'')+' '+[1,2,3].map(function(i){return v(a,'color'+i)?'<span class="sw" style="background:'+esc(v(a,'color'+i))+'"></span>':''}).join('')+'</div></div>';
  var day=0,per=null;
  FIELDS.forEach(function(f){if(f.d!==day){if(per!==null)h+='</dl>';day=f.d;h+='<h3 class="day">'+DAYN[day]+'</h3>';per=null;}
    if(f.p!==per){if(per!==null)h+='</dl>';per=f.p;h+='<h4>'+per+'교시 · '+esc(f.pt)+'</h4><dl>';}
    if(f.ck)return;var val=v(a,f.k);if(/^m10_\d+$/.test(f.k)){if(!val)return;var sc=0;for(var c=1;c<=5;c++)if(v(a,f.k+'_c'+c)==='1')sc++;val+=' ('+sc+'/5)';}
    if(f.k==='name1'){var nn=0;for(var q=1;q<=5;q++)if(v(a,'nc'+q)==='1')nn++;if(val)val+=' · 기준 '+nn+'/5';}
    h+='<dt>'+esc(f.l)+'</dt><dd'+(val?'':' class="e"')+'>'+(val?esc(val):'—')+'</dd>';});
  if(per!==null)h+='</dl>';
  $('#dbody').innerHTML=h;$('#detail').style.display='';$('#list').parentNode.style.display='none';window.scrollTo(0,0);}
$('#back').onclick=function(){$('#detail').style.display='none';$('#list').parentNode.style.display='';};
$('#csv').onclick=function(){if(!books.length){alert('내려받을 제출이 없습니다.');return;}var cols=[['이름',function(b){return b.name}],['뒤4자리',function(b){return b.code}],['보낸 때',function(b){return tm(b.updatedAt)}],['작성 교시',function(b){return done(b.a)}],['컨셉 문장',function(b){return conceptLine(b.a)}]];
  for(var i=1;i<=4;i++)(function(i){cols.push(['메뉴'+i+' 원가',function(b){var c=costOf(b.a,i);return c==null?'':Math.round(c)}]);cols.push(['메뉴'+i+' 원가율',function(b){var r=rateOf(b.a,i);return r==null?'':Math.round(r*10)/10}]);})(i);
  cols.push(['손익분기 월매출',function(b){var x=bep(b.a);return x?Math.round(x.month):''}]);cols.push(['하루 손익분기 개수',function(b){var x=bep(b.a);return x&&x.units?Math.ceil(x.units):''}]);
  FIELDS.forEach(function(f){if(f.ck)return;cols.push([f.d+'일차 '+f.p+'교시 '+f.l,function(b){return v(b.a,f.k)}]);});
  var q=function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'};var csv='﻿'+cols.map(function(c){return q(c[0])}).join(',')+'\n'+books.map(function(b){return cols.map(function(c){return q(c[1](b))}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='컨셉북_ver'+VER+'_제출_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();};
$('#refresh').onclick=load;$('#backwb').onclick=function(){window.close();};
function unlock(){$('#login').style.display='none';$('#main').style.display='';$('#out').style.display='';load();}
$('#enter').onclick=function(){var p=$('#pin').value.trim();if(!/^\d{6}$/.test(p)){$('#lmsg').textContent='숫자 6자리를 적어 주세요.';return;}
  sha(p).then(function(h){if(h!==PIN_HASH){$('#lmsg').textContent='강사 숫자가 맞지 않습니다.';return;}try{sessionStorage.setItem('ccb_t','1')}catch(e){}unlock();});};
$('#pin').addEventListener('keydown',function(e){if(e.key==='Enter')$('#enter').click();});
$('#out').onclick=function(){try{sessionStorage.removeItem('ccb_t')}catch(e){}location.reload();};
try{if(sessionStorage.getItem('ccb_t')==='1')unlock();}catch(e){}
</script></body></html>
