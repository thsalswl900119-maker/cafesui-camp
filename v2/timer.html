<style>
:root{--coral:#C67F68;--corald:#A85A45;--cream:#F8F0E7;--panel:#F2E7D8;--panel2:#FBF5EC;--ink:#4A403B;--grey:#7A6A5F}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#fff;font-family:'Nanum Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink)}
.frame{position:fixed;inset:12px;background:var(--coral);border-radius:22px}.inner{position:absolute;inset:14px;background:var(--cream);border-radius:16px;display:flex;flex-direction:column;align-items:center;padding:18px 20px;overflow:auto}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}.top img{width:64px;height:auto}.chip{background:var(--coral);color:#fff;font-family:'Do Hyeon',sans-serif;font-size:20px;padding:6px 16px;border-radius:10px}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;color:var(--corald);font-size:clamp(26px,4vw,44px);margin:10px 0 0;text-align:center;line-height:1.2}
.pre{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 6px;max-width:1100px}.pre button{font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:999px;border:2px solid #E7C6B6;background:var(--panel2);color:var(--ink);cursor:pointer}.pre button.on{background:var(--coral);border-color:var(--coral);color:#fff}
.ring{position:relative;flex:1 1 auto;min-height:140px;max-height:70vh;max-width:78vw;aspect-ratio:1;margin:6px 0}.top,h1,.pre,.bt,.hint{flex:none}.ring svg{position:absolute;inset:0;width:100%;height:100%}
.d{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.num{font-size:clamp(64px,19vh,180px);font-weight:800;color:var(--corald);font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1}.lbl{font-size:clamp(15px,2.4vh,24px);color:var(--grey);font-weight:700;text-align:center;max-width:70%;line-height:1.3}
.bt{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:8px 0 10px}.bt button{font:inherit;font-size:clamp(20px,3vh,30px);font-weight:800;padding:14px 28px;border-radius:16px;border:3px solid var(--coral);background:#fff;color:var(--corald);cursor:pointer;min-width:150px}.bt button.m{background:var(--coral);color:#fff}
.hint{font-size:14px;color:var(--grey);text-align:center}.done .num{color:#B03A2E;animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:.15}}
@media (max-width:640px){.frame{inset:6px}.inner{inset:8px;padding:10px}.bt button{min-width:0;padding:12px 18px}}

<h1 id="h">실습 타이머</h1>
<div class="pre" id="pre"></div>
<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#F2E7D8" stroke-width="3.5"/><circle id="r" cx="50" cy="50" r="47" fill="none" stroke="#C67F68" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="295.3" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg><div class="d"><div class="num" id="d">15:00</div><div class="lbl" id="l">위에서 교시를 고르거나 바로 시작</div></div></div>
<div class="bt"><button class="m" id="g" type="button">▶ 시작</button><button id="z" type="button">↺ 다시</button><button id="p" type="button">+1분</button><button id="q" type="button">−1분</button><button id="f" type="button">⛶ 전체화면</button></div>
<div class="hint">끝나면 숫자가 빨갛게 깜빡이고 소리가 한 번 납니다 · 강의안 슬라이드의 타이머는 보기만 되고 눌리지 않습니다 → 조작은 이 화면에서</div>
</div></div>
<script>
var PRE=[{"d": 1, "p": 1, "m": 10, "t": "내가 만들고 싶은 가게"}, {"d": 1, "p": 2, "m": 15, "t": "컨셉 한 줄 · 누구에게, 어떤 순간에, 왜 굳이 나인가"}, {"d": 1, "p": 3, "m": 15, "t": "내 손님의 하루와 경쟁점 3곳"}, {"d": 1, "p": 4, "m": 15, "t": "메뉴 10개 → 4개 · 시그니처 1 + 서브 3"}, {"d": 1, "p": 5, "m": 40, "t": "[실습] 컨셉북 1장 · 컨셉 정의서 & 메뉴 구성표"}, {"d": 2, "p": 1, "m": 5, "t": "음료 베이스 5종 · 간단히"}, {"d": 2, "p": 2, "m": 10, "t": "베이스로 완성하는 음료 10종"}, {"d": 2, "p": 3, "m": 20, "t": "레시피로 계산하는 원가 · 음료 10종 원가표"}, {"d": 2, "p": 4, "m": 15, "t": "가격 & 손익 · 하루 몇 잔 팔아야 버티는가"}, {"d": 2, "p": 5, "m": 40, "t": "[실습] 컨셉북 2장 · 음료 레시피 카드 & 원가·손익계산표"}, {"d": 3, "p": 1, "m": 15, "t": "가게 이름과 브랜드 한 문장"}, {"d": 3, "p": 2, "m": 15, "t": "브랜드 이미지 · 톤앤매너와 무드보드"}, {"d": 3, "p": 3, "m": 10, "t": "매출이 오르는 SNS · 플레이스 · 인스타 · 블로그의 역할"}, {"d": 3, "p": 4, "m": 30, "t": "[실습] SNS 첫 30일 운영 계획 + 소개글·프로필"}, {"d": 3, "p": 5, "m": 2, "t": "발표 · 1인 2분"}],T=900,left=T,end=0,run=false,raf=0;
var R=document.getElementById('r'),D=document.getElementById('d'),L=document.getElementById('l'),W=document.getElementById('w'),G=document.getElementById('g'),H=document.getElementById('h');
function f(s){s=Math.max(0,Math.round(s));return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function draw(){D.textContent=f(left);R.setAttribute('stroke-dashoffset',String(295.3*(1-left/T)));G.textContent=run?'⏸ 멈춤':(left>0&&left<T?'▶ 계속':'▶ 시작');document.title=(run?f(left)+' · ':'')+'실습 타이머'}
function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(function(){o.stop();a.close()},700)}catch(e){}}
function tick(){if(!run)return;left=Math.max(0,(end-Date.now())/1000);draw();if(left<=0){run=false;W.classList.add('done');draw();beep()}else raf=requestAnimationFrame(tick)}
function start(){if(left<=0)left=T;end=Date.now()+left*1000;run=true;W.classList.remove('done');tick()}
function pause(){run=false;cancelAnimationFrame(raf);draw()}
function reset(){run=false;cancelAnimationFrame(raf);left=T;W.classList.remove('done');draw()}
function setT(min,label){T=min*60;reset();L.textContent=label||'';H.textContent=label?label:'실습 타이머'}
var pb=document.getElementById('pre');PRE.forEach(function(x,i){var b=document.createElement('button');b.type='button';b.textContent=x.d+'일차 '+x.p+'교시 · '+x.m+'분';b.title=x.t;b.onclick=function(){[].forEach.call(pb.children,function(c){c.classList.remove('on')});b.classList.add('on');setT(x.m,x.d+'일차 '+x.p+'교시 · '+x.t+' · '+x.m+'분');start()};pb.appendChild(b)});
[1,3,5,10,15,20,30,40].forEach(function(m){var b=document.createElement('button');b.type='button';b.textContent=m+'분';b.onclick=function(){[].forEach.call(pb.children,function(c){c.classList.remove('on')});b.classList.add('on');setT(m,m+'분');start()};pb.appendChild(b)});
G.onclick=function(){run?pause():start()};document.getElementById('z').onclick=reset;
document.getElementById('p').onclick=function(){T+=60;left+=60;if(run)end+=60000;draw()};
document.getElementById('q').onclick=function(){if(T>60){T-=60;left=Math.max(0,left-60);if(run)end-=60000;draw()}};
document.getElementById('f').onclick=function(){var el=document.documentElement;if(document.fullscreenElement){document.exitFullscreen()}else if(el.requestFullscreen){el.requestFullscreen()}};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();run?pause():start()}else if(e.key==='r'||e.key==='R')reset();else if(e.key==='f'||e.key==='F')document.getElementById('f').click();else if(e.key==='+'||e.key==='=')document.getElementById('p').click();else if(e.key==='-')document.getElementById('q').click()});
var q=new URLSearchParams(location.search).get('m');if(q&&+q>0){setT(+q,q+'분')}draw();
</script></body></html>
