<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>강사에게 보내기 · 카페 브랜드 북</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Do+Hyeon&display=swap"><style>
:root{--coral:#A9783F;--corald:#6F4E2A;--corall:#DCCBAE;--cream:#FBF7EF;--panel:#F3EBDC;--panel2:#FDFAF4;--ink:#4A3A2A;--grey:#948570;--line:#E6DAC4;--olive:#8E9C6A;--head:"BM HANNA 11yrs Old OTF","BMHANNA11yrsold","Do Hyeon",sans-serif;--body:"Nanum Gothic","Apple SD Gothic Neo",sans-serif}
html{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}h1,h2,h3{font-family:var(--head);font-weight:400;margin:0;color:var(--corald)}h1{font-size:26px}h2{font-size:19px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px;box-shadow:0 2px 6px rgba(223,205,184,.45)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--coral);color:#fff;font-family:var(--head);font-size:18px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--corald);border:1.5px solid var(--corall)}.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:14px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--corall);border-radius:10px;background:#fff;color:var(--ink);font-size:18px;margin-top:6px}
.msg{font-size:15px;color:var(--corald);margin-top:10px;min-height:20px}.ok{color:#4E6B2E;font-weight:700}.bad{color:#B04A3A;font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.row .info{flex:1}.row b{font-size:16px}.row small{display:block;font-size:13px;color:var(--grey)}
.big{font-size:34px;text-align:center;margin:18px 0 6px}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:8px 0;font-size:15px}dt{color:var(--grey);font-size:13.5px;padding-top:2px}dd{margin:0;white-space:pre-wrap}dd.e{color:#B9AC9F;font-style:italic}
h3.day{margin:18px 0 4px;font-size:18px;padding:8px 12px;background:var(--panel);border-left:4px solid var(--coral);border-radius:0 8px 8px 0}h4{font-family:var(--head);font-weight:400;color:var(--corald);margin:12px 0 2px;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
<script>
/* Firebase 설정 — 카페스이 (cafesui) */
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyDDwIS0nXg5cDBe5ZO8yWUgUMIK3hizNGI",
  authDomain: "cafesui.firebaseapp.com",
  projectId: "cafesui",
  storageBucket: "cafesui.firebasestorage.app",
  messagingSenderId: "496994957073",
  appId: "1:496994957073:web:2ddc6ba5cea5f60a483eb0"
};
</script></head><body><div class="wrap">
<div class="top"><h1>강사에게 보내기</h1></div>
<div class="card"><div class="big" id="ico">📤</div><h2 id="ttl" style="text-align:center">강사님 화면으로 보내는 중…</h2>
<div class="msg" id="msg" style="text-align:center"></div>
<dl id="sum" style="margin-top:14px"></dl>
<button class="btn" id="again" style="display:none">다시 보내기</button>
<button class="btn ghost" id="close">← 워크북으로 돌아가기</button></div>
</div><script>
var FBC=window.FIREBASE_CONFIG,FS_BASE='https://firestore.googleapis.com/v1/projects/'+FBC.projectId+'/databases/(default)/documents/workbook/',ROSTER='명단_0000';
function sid(n,c){return String(n).replace(/[\/\s]+/g,'')+'_'+c;}
function fsEnc(v){if(v===null||v===undefined)return {nullValue:null};if(typeof v==='number')return (v%1===0)?{integerValue:String(v)}:{doubleValue:v};if(typeof v==='boolean')return {booleanValue:v};if(Array.isArray(v))return {arrayValue:{values:v.map(fsEnc)}};if(typeof v==='object'){var f={};Object.keys(v).forEach(function(k){f[k]=fsEnc(v[k]);});return {mapValue:{fields:f}};}return {stringValue:String(v)};}
function fsDec(v){if(!v)return null;if('stringValue' in v)return v.stringValue;if('integerValue' in v)return +v.integerValue;if('doubleValue' in v)return v.doubleValue;if('booleanValue' in v)return v.booleanValue;if('mapValue' in v){var o={},f=v.mapValue.fields||{};Object.keys(f).forEach(function(k){o[k]=fsDec(f[k]);});return o;}if('arrayValue' in v)return (v.arrayValue.values||[]).map(fsDec);return null;}
function fsFetch(url,opt){opt=opt||{};var c=window.AbortController?new AbortController():null,t=null;if(c){opt.signal=c.signal;t=setTimeout(function(){c.abort();},15000);}
  return fetch(url,opt).then(function(r){if(t)clearTimeout(t);return r.text().then(function(txt){var j={};try{j=txt?JSON.parse(txt):{};}catch(e){}if(!r.ok){var er=new Error((j.error&&j.error.message)||('http '+r.status));er.status=r.status;throw er;}return j;});},function(e){if(t)clearTimeout(t);throw e;});}
function fsGet(id){return fsFetch(FS_BASE+encodeURIComponent(id)+'?key='+FBC.apiKey).then(function(j){return j&&j.fields?fsDec({mapValue:{fields:j.fields}}):null;},function(e){if(e.status===404)return null;throw e;});}
function fsSet(id,obj){return fsFetch(FS_BASE+encodeURIComponent(id)+'?key='+FBC.apiKey,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:fsEnc(obj).mapValue.fields})});}
function fsRoster(id,now,remove){var q='?key='+FBC.apiKey+['name','code','day','updatedAt'].map(function(f){return '&updateMask.fieldPaths='+f;}).join('')+'&updateMask.fieldPaths='+encodeURIComponent('a.`'+id.replace(/[`\\]/g,'\\$&')+'`');
  var doc={name:'명단',code:'0000',day:0,updatedAt:now,a:{}};if(!remove)doc.a[id]=now;
  return fsFetch(FS_BASE+encodeURIComponent(ROSTER)+q,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:fsEnc(doc).mapValue.fields})});}
function unb64(t){return JSON.parse(decodeURIComponent(escape(atob(t))));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}

var payload=null;
function show(ok,t,m){document.getElementById('ico').textContent=ok?'✅':'⚠️';document.getElementById('ttl').textContent=t;document.getElementById('msg').innerHTML=m;document.getElementById('again').style.display=ok?'none':'';}
function go(){
  var h=decodeURIComponent((location.hash||'').slice(1)).replace(/\s+/g,'');
  if(h.indexOf('CAFEBB1:')!==0){show(false,'보낼 내용이 없습니다','워크북 화면에서 「강사에게 보내기」를 다시 눌러 주세요.');return;}
  try{payload=unb64(h.slice(8));}catch(e){show(false,'내용을 읽지 못했습니다','워크북에서 「강사에게 보내기」를 다시 눌러 주세요.');return;}
  var name=String(payload.n||'').trim().slice(0,30),code=String(payload.c||'').trim();
  if(!name||!/^\d{4}$/.test(code)||!payload.a){show(false,'이름·번호가 없습니다','워크북 첫 화면에서 이름과 뒤 4자리를 적고 들어온 뒤 다시 보내 주세요.');return;}
  var a=payload.a;document.getElementById('sum').innerHTML='<dt>이름</dt><dd>'+esc(name)+' ('+esc(code)+')</dd><dt>카페 이름</dt><dd>'+esc(a.cafeName||'(아직)')+'</dd><dt>콘셉트</dt><dd>'+esc(a.concept_v3||a.concept_v2||a.concept||'(아직)')+'</dd>';
  var now=Date.now(),id=sid(name,code);
  show(true,'강사님 화면으로 보내는 중…','잠시만 기다려 주세요.');
  fsSet(id,{name:name,code:code,day:+payload.d||1,a:a,updatedAt:now}).then(function(){return fsRoster(id,now,false);}).then(function(){
    var d=new Date();show(true,'보냈습니다 ✓','<span class="ok">강사님 화면에 바로 보입니다 ('+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+').</span><br>이 창은 닫고 워크북으로 돌아가세요. 더 적은 뒤에 다시 보내면 최신 것으로 바뀝니다.');
  },function(e){show(false,'보내지 못했습니다','<span class="bad">인터넷 연결을 확인하고 「다시 보내기」를 눌러 주세요.</span><br>계속 안 되면 워크북의 「복사하기 (예비)」로 복사해 강사 카톡에 보내 주세요.<br><small>'+esc(e&&e.message||'')+'</small>');});
}
document.getElementById('again').onclick=go;
document.getElementById('close').onclick=function(){if(history.length>1){history.back();}else{window.close();document.getElementById('msg').innerHTML+='<br>워크북 화면(탭)으로 돌아가 주세요.';}};
go();
</script></body></html>
